
services:
  backend:
    build:
      context: ./backend
    container_name: brainscan-backend
    ports:
      - "8000:8000"
    environment:
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_ENABLE_ONEDNN_OPTS: "0"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: brainscan-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
